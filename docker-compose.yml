version: "3.8"

services:

  # =====================================================
  # NGINX
  # Serves public/ and proxies PHP requests to app:9000
  # =====================================================

  nginx:

    build:
      context: ./docker/nginx
      dockerfile: Dockerfile

    image: glover-nginx:latest

    restart: unless-stopped

    ports:
      - "${APP_PORT:-3030}:3030"

    volumes:
      - glover-public:/var/www/html/public-shared:ro

    depends_on:
      - app

    networks:
      - glover-network


  # =====================================================
  # GLOVER APPLICATION
  # Laravel + PHP-FPM
  # =====================================================

  app:

    build:
      context: .
      dockerfile: Dockerfile

    image: glover-app:latest

    restart: unless-stopped

    environment:

      APP_NAME: ${APP_NAME:-Glover}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL}

      LOG_CHANNEL: ${LOG_CHANNEL:-stack}

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

      BROADCAST_CONNECTION: reverb

      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}

      REVERB_HOST: ${REVERB_HOST}
      REVERB_PORT: 6001
      REVERB_SCHEME: ${REVERB_SCHEME:-https}

      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    volumes:
      - glover-storage:/var/www/html/storage
      - glover-public:/var/www/html/public-shared

    depends_on:

      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - glover-network


  # =====================================================
  # QUEUE WORKER
  # Notifications, emails, order processing
  # =====================================================

  worker:

    image: glover-app:latest

    restart: unless-stopped

    command:
      sh -c "php artisan queue:work redis --sleep=3 --tries=3 --timeout=120"

    environment:

      CONTAINER_ROLE: worker

      APP_ENV: ${APP_ENV:-production}

      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis

    volumes:
      - glover-storage:/var/www/html/storage

    depends_on:
      - app

    networks:
      - glover-network


  # =====================================================
  # Laravel Scheduler
  # =====================================================

  scheduler:

    image: glover-app:latest

    restart: unless-stopped

    command:
      sh -c "while true; do php artisan schedule:run; sleep 60; done"

    environment:

      CONTAINER_ROLE: scheduler

      APP_ENV: ${APP_ENV:-production}

      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis

    volumes:
      - glover-storage:/var/www/html/storage

    depends_on:
      - app

    networks:
      - glover-network


  # =====================================================
  # REVERB
  # Websocket server for broadcasting
  # =====================================================

  reverb:

    image: glover-app:latest

    restart: unless-stopped

    command:
      sh -c "php artisan reverb:start --host=0.0.0.0 --port=6001"

    environment:

      CONTAINER_ROLE: reverb

      APP_ENV: ${APP_ENV:-production}

      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis

      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6001

    volumes:
      - glover-storage:/var/www/html/storage

    depends_on:
      - app

    networks:
      - glover-network


  # =====================================================
  # MYSQL DATABASE
  # =====================================================

  mysql:

    image: mysql:8.0

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]

      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - glover-network


  # =====================================================
  # REDIS
  # =====================================================

  redis:

    image: redis:7-alpine

    restart: unless-stopped

    volumes:
      - redis-data:/data

    command:
      redis-server --appendonly yes

    healthcheck:

      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - glover-network


networks:

  glover-network:
    driver: bridge


volumes:

  mysql-data:
  redis-data:
  glover-storage:
  glover-public:
